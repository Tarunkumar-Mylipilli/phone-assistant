name: Build Phone Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug

    - name: Verify and Move APK
      run: |
        mkdir -p release_apk
        find . -name "*.apk" -exec cp {} release_apk/phone-assistant.apk \;
        ls -la release_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneAssistant-apk
        path: release_apk/phone-assistant.apk
        retention-days: 14

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-v1.0.${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready to Install!
          - Auto cleans unnecessary background processes
          - Real-time RAM & Battery health monitoring
          - Screen Time quick access
          - Everyday background routine automated
          
          **Download phone-assistant.apk below directly to your phone and install.**
        files: release_apk/phone-assistant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
