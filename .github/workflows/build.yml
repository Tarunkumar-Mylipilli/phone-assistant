name: Build Phone Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Locate APK
      run: |
        ./gradlew assembleDebug --stacktrace
        find . -name "*.apk"
        mkdir -p build_output
        cp $(find app/build -name "*.apk" | head -n 1) build_output/app-debug.apk
        ls -la build_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneAssistant-APK
        path: build_output/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready to Install!
          Download `app-debug.apk` directly to your phone and install.
        files: build_output/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
