name: Build Phone Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Cache and Tool
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Collect and Release APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/*.apk dist/phone-assistant.apk
        ls -la dist/

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: app-v1.0.${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready!
          Download `phone-assistant.apk` below directly to your phone and tap Install.
        files: dist/phone-assistant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
