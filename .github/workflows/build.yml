name: Build Phone Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace || true

    - name: Show Detailed Output Location
      run: |
        find app/build -type f -name "*.apk" || true
        find . -name "*.apk" || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneAssistant-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
        retention-days: 14

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready to Install!
          - Auto cleans unnecessary background processes
          - Real-time RAM & Battery health monitoring
          - Screen Time quick access
          - Everyday background routine automated
          
          **Download app-debug.apk below directly to your phone and install.**
        files: "**/build/outputs/apk/**/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
