name: Build Phone Assistant APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Build and Capture Error Log
      id: gradle_build
      run: |
        ./gradlew assembleDebug --stacktrace > build_output.log 2>&1 || true
        cat build_output.log
        if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
          echo "APK_EXISTS=true" >> $GITHUB_OUTPUT
        else
          echo "APK_EXISTS=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Full Build Log
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-output-log
        path: build_output.log

    - name: Create Release with APK
      if: steps.gradle_build.outputs.APK_EXISTS == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-v1.0.${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready!
          Download `app-debug.apk` directly to your phone and install.
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
