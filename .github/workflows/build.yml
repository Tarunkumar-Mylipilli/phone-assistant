name: Build and Release Phone Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Docker Android Builder
      run: |
        docker run --rm -v $(pwd):/project -w /project mingc/android-build-box:latest bash -c "gradle assembleDebug"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: PhoneAssistant-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready to Install!
          - Auto cleans unnecessary background processes
          - Real-time RAM & Battery health monitoring
          - Screen Time quick access
          - Everyday background routine automated
          
          **Download the .apk below directly to your phone and install.**
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
