name: Build and Release Phone Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts (Direct Download)
      uses: actions/upload-artifact@v4
      with:
        name: PhoneAssistant-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Phone Assistant APK v1.0.${{ github.run_number }}
        body: |
          ### 📱 Phone Assistant APK Ready to Install!
          - Auto cleans unnecessary background processes
          - Monitors RAM & Battery
          - Screen Time quick access
          - Everyday background routine automated
          
          **Download the .apk below directly to your phone and install.**
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
